<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HiDrop Neomorphic Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Neomorphic Palette - White base for D-pad card */
      --neo-bg: #22252a; /* Dark charcoal page background */
      --neo-card-bg: #ffffff; /* White background of the card */
      --neo-text-main: #2d3748;
      --neo-text-muted: #718096;
      
      /* Neomorphism Shadows on White Card */
      --neo-shadow-out: 6px 6px 12px #e2e8f0, -6px -6px 12px #ffffff;
      --neo-shadow-in: inset 4px 4px 8px #e2e8f0, inset -4px -4px 8px #ffffff;
      
      --neo-shadow-dot-in: inset 2px 2px 5px #e2e8f0, inset -2px -2px 5px #ffffff;

      --accent-danger: #e53e3e;
      --accent-primary: #3182ce;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--neo-bg);
      color: var(--neo-text-main);
      min-height: 100vh;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Main Layout Wrapper */
    .main-layout-wrapper {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: row;
      background-color: var(--neo-bg);
    }

    /* Left Dark Charcoal Pane (60% Area) */
    .left-pane {
      width: 60%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 60px;
    }

    .logo-container {
      width: 100%;
      max-width: 440px; /* Made the logo larger */
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .logo-container img {
      width: 100%;
      height: auto;
      object-fit: contain;
    }

    /* Continuous wave loading loop directly under logo, transparent background */
    .loader-container {
      margin-top: 30px;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      transition: all 0.4s ease;
    }

    .loop-video {
      width: 160px; /* cleanly sized video */
      height: auto;
      mix-blend-mode: screen; /* transparent on dark background */
      filter: invert(1) grayscale(1) contrast(2) brightness(1.6);
    }

    /* Right Pane (40% Area) */
    .right-pane {
      width: 40%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 50px 40px 20px; /* Gives perfect spacing around the card */
    }

    /* White rounded D-pad card - Auto height to prevent vertical text overflow */
    .auth-neo-panel {
      width: 100%;
      max-width: 390px;
      height: auto;
      border-radius: 32px;
      background: var(--neo-card-bg);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
      padding: 35px 25px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: all 0.4s ease;
    }

    .auth-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--neo-text-main);
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .auth-subtitle {
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--neo-text-muted);
      text-align: center;
      line-height: 1.4;
      margin-bottom: 24px;
      max-width: 280px;
    }

    /* PIN Dots (Inset Neomorphic on White) */
    .pin-dots-container {
      display: flex;
      gap: 16px;
      margin-bottom: 24px;
    }

    .pin-dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--neo-card-bg);
      box-shadow: var(--neo-shadow-dot-in);
      position: relative;
      transition: all 0.2s ease;
    }

    .pin-dot::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent-primary);
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .pin-dot.filled::after {
      transform: translate(-50%, -50%) scale(1);
    }

    /* PIN Keypad (Popout buttons) */
    .pin-keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      width: 100%;
      max-width: 270px;
    }

    .pin-key {
      aspect-ratio: 1;
      border-radius: 50%;
      border: none;
      background: var(--neo-card-bg);
      box-shadow: var(--neo-shadow-out);
      color: var(--neo-text-main);
      font-family: 'Outfit', sans-serif;
      font-size: 1.35rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Neomorphic Clicked/Pressed State */
    .pin-key:active {
      box-shadow: var(--neo-shadow-in);
      transform: scale(0.97);
    }

    .pin-key.key-action {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--neo-text-muted);
    }

    .pin-key.key-delete {
      font-size: 1.1rem;
    }

    /* Error Message */
    .auth-error-msg {
      margin-top: 20px;
      color: var(--accent-danger);
      font-size: 0.8rem;
      font-weight: 700;
      background: rgba(229, 62, 62, 0.08);
      padding: 8px 16px;
      border-radius: 12px;
      text-align: center;
      animation: pulse 1.5s infinite;
      display: none;
    }

    /* Device Link */
    .reset-device-link {
      margin-top: 24px;
      background: none;
      border: none;
      color: var(--accent-primary);
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.2s;
    }

    .reset-device-link:hover {
      opacity: 0.8;
      text-decoration: underline;
    }

    /* Animations */
    @keyframes pulse {
      0% { opacity: 0.9; }
      50% { opacity: 0.6; }
      100% { opacity: 0.9; }
    }

    /* Shake Animation for incorrect PIN entry */
    .auth-shake {
      animation: shake 0.4s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }

    /* Mobile Responsive Sizing */
    @media (max-width: 900px) {
      .main-layout-wrapper {
        flex-direction: column;
        height: auto;
        min-height: 100vh;
      }
      .left-pane {
        width: 100%;
        height: auto;
        min-height: 280px;
        padding: 40px 20px 20px 20px;
      }
      .right-pane {
        width: 100%;
        height: auto;
        min-height: 520px;
        padding: 10px 20px 40px 20px;
      }
      .logo-container {
        max-width: 280px;
      }
      .loader-container {
        margin-top: 15px;
      }
      .auth-neo-panel {
        max-height: none;
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>

  <div class="main-layout-wrapper">
    <!-- Left Side: Brand & Loading (60% Area) -->
    <div class="left-pane" id="logo-pane">
      <div class="logo-container">
        <!-- Always white tagline logo for dark charcoal background -->
        <img id="main-logo" src="HiDrop Logo With Tagline (White).svg" alt="HiDrop Logo" onerror="this.src='/src/assets/HiDrop Logo With Tagline (White).svg'" />
      </div>
      
      <!-- Continuous Wave Loading Animation - Video only, no yellow box and no text label -->
      <div class="loader-container" id="continuous-loader">
        <video src="wave_loading.mp4" autoplay loop muted playsinline class="loop-video"></video>
      </div>
    </div>

    <!-- Right Side: PIN Entry (40% Area) -->
    <div class="right-pane" id="keypad-pane">
      <!-- Neomorphic Card -->
      <div class="auth-neo-panel" id="auth-panel">
        <h1 class="auth-title">Security Lock</h1>
        <p class="auth-subtitle" id="auth-subtitle">
          Enter 4-Digit PIN to access HiDrop Admin Panel
        </p>

        <!-- Dots Inset -->
        <div class="pin-dots-container">
          <div class="pin-dot" id="dot-0"></div>
          <div class="pin-dot" id="dot-1"></div>
          <div class="pin-dot" id="dot-2"></div>
          <div class="pin-dot" id="dot-3"></div>
        </div>

        <!-- Keypad Popout -->
        <div class="pin-keypad">
          <button class="pin-key" onclick="pressKey('1')">1</button>
          <button class="pin-key" onclick="pressKey('2')">2</button>
          <button class="pin-key" onclick="pressKey('3')">3</button>
          <button class="pin-key" onclick="pressKey('4')">4</button>
          <button class="pin-key" onclick="pressKey('5')">5</button>
          <button class="pin-key" onclick="pressKey('6')">6</button>
          <button class="pin-key" onclick="pressKey('7')">7</button>
          <button class="pin-key" onclick="pressKey('8')">8</button>
          <button class="pin-key" onclick="pressKey('9')">9</button>
          
          <button class="pin-key key-action" onclick="clearPin()">Clear</button>
          <button class="pin-key" onclick="pressKey('0')">0</button>
          <button class="pin-key key-action key-delete" onclick="deleteLast()">⌫</button>
        </div>

        <!-- Error MSG -->
        <div class="auth-error-msg" id="error-box">Incorrect PIN code. Please try again.</div>

        <button class="reset-device-link" onclick="resetSim()">
          Reset Device Trust Token
        </button>
      </div>
    </div>
  </div>

  <script>
    let pin = '';
    const CORRECT_PIN = '1814'; // Standard Admin PIN code
    
    function pressKey(num) {
      if (pin.length >= 4) return;
      
      // Hide error on new input
      document.getElementById('error-box').style.display = 'none';
      
      pin += num;
      updateDots();

      if (pin.length === 4) {
        document.getElementById('auth-subtitle').innerText = 'Verifying PIN code...';
        setTimeout(() => {
          if (pin === CORRECT_PIN) {
            document.getElementById('auth-subtitle').style.color = '#38a169';
            document.getElementById('auth-subtitle').innerText = 'Access Granted! Redirecting...';
            document.getElementById('auth-panel').style.transform = 'scale(1.02)';
            document.getElementById('auth-panel').style.transition = 'transform 0.3s ease';
            setTimeout(() => {
              alert('Successfully logged in! (Mock success)');
              resetSim();
            }, 500);
          } else {
            // Incorrect PIN entry shake
            document.getElementById('auth-panel').classList.add('auth-shake');
            document.getElementById('error-box').style.display = 'block';
            document.getElementById('auth-subtitle').innerText = 'Enter 4-Digit PIN to access HiDrop Admin Panel';
            document.getElementById('auth-subtitle').style.color = '';
            
            setTimeout(() => {
              document.getElementById('auth-panel').classList.remove('auth-shake');
              clearPin();
            }, 400);
          }
        }, 500);
      }
    }

    function deleteLast() {
      if (pin.length === 0) return;
      pin = pin.slice(0, -1);
      updateDots();
      document.getElementById('error-box').style.display = 'none';
    }

    function clearPin() {
      pin = '';
      updateDots();
      document.getElementById('error-box').style.display = 'none';
    }

    function updateDots() {
      for (let i = 0; i < 4; i++) {
        const dot = document.getElementById(`dot-${i}`);
        if (pin.length > i) {
          dot.classList.add('filled');
        } else {
          dot.classList.remove('filled');
        }
      }
    }

    function resetSim() {
      clearPin();
      document.getElementById('auth-subtitle').innerText = 'Enter 4-Digit PIN to access HiDrop Admin Panel';
      document.getElementById('auth-subtitle').style.color = '';
      document.getElementById('auth-panel').style.transform = 'none';
    }

    // Keyboard support for keypad
    document.addEventListener('keydown', (e) => {
      if (e.key >= '0' && e.key <= '9') {
        pressKey(e.key);
      } else if (e.key === 'Backspace') {
        deleteLast();
      } else if (e.key === 'Escape' || e.key === 'Delete') {
        clearPin();
      }
    });
  </script>
</body>
</html>
